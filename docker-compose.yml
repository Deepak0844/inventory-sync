# Phase 0: API and Postgres. Worker and Caddy arrive in later phases.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: inventory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    volumes:
      - appdata:/srv/data  # Test run screenshots: the worker writes them, the API serves them
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:${POSTGRES_PASSWORD}@db:5432/inventory
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"  # Caddy fronts it in production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      retries: 5
      start_period: 10s

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    volumes:
      - appdata:/srv/data
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:${POSTGRES_PASSWORD}@db:5432/inventory
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy  # the API container runs the migrations

volumes:
  pgdata:
  appdata:
